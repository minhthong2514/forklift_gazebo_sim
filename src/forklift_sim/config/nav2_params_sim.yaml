bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: "odom"
    odom_duration: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"] 
    path_handler_plguins: ["PathHandler"]
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 20.0
    
    # Goal checker parameters
    goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.05
      path_length_tolerance: 1.0

    # Path handle parameters
    PathHandler:
      plugin: "nav2_controller::FeasiblePathHandler"
      prune_distance: 2.0
      enforce_path_inversion: True
      enforce_path_rotation: True
      inversion_xy_tolerance: 0.2
      inversion_yaw_tolerance: 0.4
      minimum_rotation_angle: 0.785
      reject_unit_path: False

    # DWB parameters
    FollowPath:
      # Rotation Shim controller
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      angular_dist_threshold: 0.785
      forward_sampling_distance: 0.5
      angular_disengage_threshold: 0.3925
      rotate_to_heading_angular_vel: 0.8      # Vyaw: 0.8 rad/s
      max_angular_accel: 2.0                  # accel: 2.0 rad/s2
      max_cost_threshold: 254.0
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: True
      rotate_to_heading_once: true
      closed_loop: true
      use_path_orientations: false

      # Primary DWB controller
      primary_controller: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: -0.15
      max_vel_x: 0.35
      min_vel_y: -0.20
      max_vel_y: 0.20
      max_vel_theta: 0.35
      min_speed_xy: 0.02
      max_speed_xy: 0.25
      min_speed_theta: 0.15
      acc_lim_x: 0.5
      acc_lim_y: 0.3
      acc_lim_theta: 0.5
      decel_lim_x: -0.8
      decel_lim_y: -0.5
      decel_lim_theta: -0.8
      vx_samples: 10
      vy_samples: 3
      vtheta_samples: 10
      sim_time: 2.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5
      xy_goal_tolerance: 0.03
      trans_stopped_velocity: 0.1
      short_circuit_trajectory_evaluation: True
      stateful: True
      discretize_by_time: True 
      critics: ["RotateToGoal", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist", "PreferForwardCritic"]
      # critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # BaseObstacle.scale: 10.0
      ObstacleFootprint.scale: 1.0
      PathAlign.scale: 32.0   # 85.0
      PathAlign.forward_point_distance: 0.325
      GoalAlign.scale: 24.0   # 32.0
      GoalAlign.forward_point_distance: 0.325
      PathDist.scale: 32.0    # 45.0
      GoalDist.scale: 24.0    # 20.0
      RotateToGoal.scale: 45.0
      RotateToGoal.slowing_factor: 20.0 
      RotateToGoal.lookahead_time: -1.0
      RotateToGoal.xy_goal_tolerance: 0.05
      PreferForwardCritic.scale: 1.0
      PreferForwardCritic.penalty: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: True
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[[-0.27, 0.22], [0.255, 0.22], [0.31, 0.145], [0.62, 0.1], [0.62, 0.08], [0.62, -0.08], [0.62, -0.1], [0.31, -0.145], [0.255, -0.22], [-0.27, -0.22]]"

      footprint_padding: 0.0
      plugins: ["obstacle_layer", "inflation_layer"]
      # Obstacle layer
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        max_obstacle_height: 2.0
        combination_method: 1
        scan:
          topic: /scan
          raytrace_max_range: 3.5
          raytrace_min_range: 0.2
          obstacle_max_range: 3.0
          obstacle_min_range: 0.2
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 15.0
        inflation_radius: 0.70                            
      always_send_full_costmap: True  
      introspection_mode: "disabled"

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: True
      footprint: "[[-0.27, 0.22], [0.255, 0.22], [0.31, 0.145], [0.62, 0.1], [0.62, 0.08], [0.62, -0.08], [0.62, -0.1], [0.31, -0.145], [0.255, -0.22], [-0.27, -0.22]]"

      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      # Static layer
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        enabled: true
        subscribe_to_updates: true
      # Obstacle layer
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        max_obstacle_height: 2.0
        combination_method: 1
        scan:
          topic: /scan
          raytrace_max_range: 3.5
          raytrace_min_range: 0.2
          obstacle_max_range: 3.0
          obstacle_min_range: 0.2
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflate_unknown: false
        inflate_around_unknown: true
        cost_scaling_factor: 15.0
        inflation_radius: 0.70                          
      always_send_full_costmap: True
      introspection_mode: "disabled"

map_server:
  ros__parameters:
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    # GridBased:
    #   plugin: "nav2_navfn_planner/NavfnPlanner"
    #   tolerance: 2.0
    #   use_astar: true
    #   allow_unknown: true
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 3.0
      downsample_costmap: false             # whether or not to downsample the map
      downsampling_factor: 1                # multiplier for the resolution of the costmap layer (e.g. 2 on a 5cm costmap would be 10cm)
      allow_unknown: true                   # allow traveling in unknown space
      max_iterations: 1000000               # maximum total iterations to search for before failing (in case unreachable), set to -1 to disable
      max_on_approach_iterations: 1000      # maximum number of iterations to attempt to reach goal once in tolerance
      max_planning_time: 5.0                # max time in s for planner to plan, smooth
      cost_travel_multiplier: 2.0           # Cost multiplier to apply to search to steer away from high cost areas. Larger values will place in the center of aisles more exactly (if non-`FREE` cost potential field exists) but take slightly longer to compute. To optimize for speed, a value of 1.0 is reasonable. A reasonable tradeoff value is 2.0. A value of 0.0 effective disables steering away from obstacles and acts like a naive binary search A*.
      use_final_approach_orientation: false # Whether to set the final path pose at the goal's orientation to the requested orientation (false) or in line with the approach angle so the robot doesn't rotate to heading (true)
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
    # GridBased:
    #   plugin: "nav2_smac_planner/SmacPlannerHybrid" 
    #   downsample_costmap: false
